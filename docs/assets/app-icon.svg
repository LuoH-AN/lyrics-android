<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="桌面歌词应用图标">
  <!-- 纸面米白底、扁平、纯边框、橙色高亮当前歌词行 -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#f5f1e8"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="103.5" fill="none" stroke="#d9d2c3" stroke-width="3"/>
  <!-- 歌词行：暖灰为已过/未到，橙为当前行 -->
  <g stroke-linecap="round">
    <line x1="140" y1="176" x2="332" y2="176" stroke="#b8b0a0" stroke-width="20"/>
    <line x1="140" y1="232" x2="300" y2="232" stroke="#b8b0a0" stroke-width="20"/>
    <!-- 当前行：橙色、更长更粗 -->
    <line x1="140" y1="292" x2="372" y2="292" stroke="#e8590c" stroke-width="26"/>
    <line x1="140" y1="352" x2="288" y2="352" stroke="#b8b0a0" stroke-width="20"/>
  </g>
</svg>
