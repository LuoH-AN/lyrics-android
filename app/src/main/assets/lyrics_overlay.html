<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>桌面歌词</title>
  <style>
    /* Hidden data engine only: no visible large-window UI. */
    html.native-engine body { display:none !important; }
  </style>
</head>
<body class="background-transparent compact">
  <!-- Hidden data engine only. Visible lyrics are native. -->
  <div class="compact-lyric" id="compact-lyric"></div>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    // Only the compact renderer is retained; it is exercised by the regression
    // tests but not used by the native overlay. All large-window DOM is gone.
    const ui = { compactLyric: $('compact-lyric') };
    // Android keeps this document offscreen for matching/cache compatibility only.
    const nativeRendering = !!(window.LobstaNativeLyrics && window.LobstaNativeLyrics.renderNativeLyrics);
    if(nativeRendering) document.documentElement.classList.add('native-engine');
    let nativeMessage = '';
    let supplementDueAt = 0;
    let backgroundMode = 'transparent';
    let lyricFontScale=1;
    let translationMode='bilingual';
    const playback = {
      hasSession:false, track:'', artist:'', album:'', state:'paused', positionMs:0,
      durationMs:0, speed:0, receivedAt:performance.now(), key:'', lyrics:[], active:-1,
      cover:'', coverIsNative:false, requestId:0, abort:null, lyricOffsetMs:0,
      candidates:[], candidateIndex:0, canPlay:false, canPause:false, canPrevious:false, canNext:false, canSeek:false
    };
    let supplementEpoch=0;
    let candidateSignature='';
    let supplementRequestTimer=0;
    let supplementInFlight=false;
    let supplementRequestedIds=[];
    const supplementSkippedIds=new Set();
    let supplementWindowEnd=-1;
    let supplementPrefetchRemaining=4;
    const LYRICS_CACHE_SCHEMA=3;

    function emitNativeLyrics(message = nativeMessage) {
      nativeMessage = message;
      if(!nativeRendering)return;
      window.LobstaNativeLyrics.renderNativeLyrics(JSON.stringify({
        requestId:playback.requestId, key:playback.key,
        track:playback.track, artist:playback.artist,
        durationMs:playback.durationMs, message:nativeMessage, lines:playback.lyrics
      }));
    }

    function updateNativeActiveLine(position) {
      const lines=playback.lyrics;
      if(!lines.length){playback.active=-1;return;}
      if(lines[0].plain){playback.active=plainPlaybackIndex();return;}
      let low=0,high=lines.length-1,index=0;
      while(low<=high){
        const mid=(low+high)>>1;
        if(lines[mid].t<=position+90){index=mid;low=mid+1;}else high=mid-1;
      }
      playback.active=index;
    }

    // Driven by the service Handler, never by an offscreen WebView animation frame.
    function engineTick() {
      if(!nativeRendering||!playback.hasSession)return;
      updateNativeActiveLine(lyricPosition());
      if(supplementDueAt && performance.now()>=supplementDueAt){
        supplementDueAt=0;
        startSupplementWindow();
      }
      maybePrefetchSupplement();
    }

    function requestSupplement(reset=true) {
      clearTimeout(supplementRequestTimer);
      supplementRequestTimer=0;
      supplementDueAt=0;
      if(reset){
        supplementWindowEnd=-1;
        supplementInFlight=false;
        supplementRequestedIds=[];
        supplementSkippedIds.clear();
        ++supplementEpoch;
        if(window.LobstaNativeLyrics&&window.LobstaNativeLyrics.cancelSupplement)window.LobstaNativeLyrics.cancelSupplement();
      }
      if(translationMode==='original'||!playback.lyrics.length)return;
      if(nativeRendering) supplementDueAt=performance.now()+(reset?520:80);
      else supplementRequestTimer=setTimeout(startSupplementWindow,reset?520:80);
    }

    function startSupplementWindow() {
      supplementRequestTimer=0;
      if(supplementInFlight||translationMode==='original'||!playback.lyrics.length)return;
      const active=plainPlaybackIndex();
      let strategy={behind:2,ahead:12,prefetch:4};
      if(window.LobstaNativeLyrics&&window.LobstaNativeLyrics.supplementStrategy){
        try{strategy={...strategy,...JSON.parse(window.LobstaNativeLyrics.supplementStrategy())};}catch(_){}
      }
      const behind=Math.max(0,Math.min(8,Number(strategy.behind)||2));
      const ahead=Math.max(6,Math.min(48,Number(strategy.ahead)||12));
      supplementPrefetchRemaining=Math.max(2,Math.min(16,Number(strategy.prefetch)||4));
      const from=Math.max(0,active-behind);
      const to=Math.min(playback.lyrics.length,active+ahead+1);
      supplementWindowEnd=Math.max(active,to-1);
      const missing=[];
      for(let id=from;id<to;id++){
        const line=playback.lyrics[id];
        if(line&&!line.translation&&!line.supplement&&!supplementSkippedIds.has(id)&&line.text.trim())missing.push({id,text:line.text});
      }
      if(!missing.length)return;
      const epoch=++supplementEpoch;
      if(missing.length&&window.LobstaNativeLyrics&&window.LobstaNativeLyrics.translateMissing){
        supplementInFlight=true;
        supplementRequestedIds=missing.map(row=>row.id);
        window.LobstaNativeLyrics.translateMissing(epoch,JSON.stringify(missing));
      }
    }

    function maybePrefetchSupplement() {
      if(supplementInFlight||supplementRequestTimer||supplementDueAt||translationMode==='original')return;
      if(supplementWindowEnd<0||plainPlaybackIndex()>=supplementWindowEnd-supplementPrefetchRemaining)requestSupplement(false);
    }

    function receiveSupplement(epoch,data) {
      if(epoch!==supplementEpoch||!data)return;
      if(data.status){
        const failed=data.status==='error';
        const skipped=data.status==='skipped';
        if(skipped) supplementRequestedIds.forEach(id=>supplementSkippedIds.add(id));
        if(data.status==='done'||data.status==='off'||skipped||failed){
          supplementInFlight=false;
          supplementRequestedIds=[];
        }
        if(window.LobstaNativeLyrics.reportSupplementStatus){
          window.LobstaNativeLyrics.reportSupplementStatus(JSON.stringify({
            requestId:playback.requestId,track:playback.track,artist:playback.artist,
            status:data.status,message:data.message||''
          }));
        }
        // Configuration errors wait for an explicit settings refresh, rather than retrying every tick.
        if(data.status==='off'||failed) supplementWindowEnd=playback.lyrics.length+48;
        else if(data.status==='done'||skipped) maybePrefetchSupplement();
        return;
      }
      const line=playback.lyrics[data.id];
      if(!line||line.translation||!data.text)return;
      line.translation=data.text;
      line.supplement=data.source;
      emitNativeLyrics();
    }

    function normalizedKey(track, artist) {
      return (track + '\u0000' + artist).trim().toLocaleLowerCase();
    }

    function currentPosition() {
      let value = playback.positionMs;
      if (playback.state === 'playing' && playback.speed > 0) {
        value += (performance.now() - playback.receivedAt) * playback.speed;
      }
      if (playback.durationMs > 0) value = Math.min(value, playback.durationMs);
      return Math.max(0, value);
    }

    function lyricPosition() {
      return Math.max(0,currentPosition()+Number(playback.lyricOffsetMs||0));
    }

    function parseLrc(raw) {
      if (!raw) return [];
      const parsed = [];
      const credit = /^(作词|作曲|编曲|制作人|混音|母带|录音|和声|监制|出品|发行|词|曲)\s*[：:]/i;
      String(raw).replace(/\r/g, '').split('\n').forEach(line => {
        const stamps = [...line.matchAll(/\[(\d{1,3}):(\d{2})(?:[\.:](\d{1,3}))?\]/g)];
        if (!stamps.length) return;
        const text = line.replace(/\[[^\]]+\]/g, '').trim();
        if (!text || credit.test(text)) return;
        stamps.forEach(match => {
          const fraction = match[3] ? Number(('0.' + match[3])) * 1000 : 0;
          parsed.push({ t:(Number(match[1]) * 60 + Number(match[2])) * 1000 + fraction, text });
        });
      });
      parsed.sort((a,b) => a.t - b.t);
      return parsed.filter((line,index,list) => !index || line.t !== list[index-1].t || line.text !== list[index-1].text);
    }

    function plainLyrics(raw) {
      return String(raw || '').replace(/\r/g,'').split('\n').map(v => v.trim()).filter(Boolean)
        .filter(v => !/^\[[a-z]+:/i.test(v))
        .map(v=>v.replace(/^(?:\[\d+:\d+[^\]]*\])+\s*/,''))
        .filter(v=>v&&!/^(作词|作詞|作曲|编曲|編曲|词|曲|composer|lyricist|arranger)\s*[:：]/i.test(v))
        .map((text,index) => ({ t:index * 100000000, text, plain:true }));
    }

    function parseWordLyrics(raw) {
      if(!raw)return [];
      const lines=[];
      const credit=/^(作词|作曲|编曲|制作人|混音|母带|录音|和声|监制|出品|发行|词|曲)\s*[：:]/i;
      String(raw).replace(/\r/g,'').split('\n').forEach(rawLine=>{
        const header=rawLine.match(/^\[(\d+),(\d+)\](.*)$/);
        if(!header)return;
        const words=[];
        const body=header[3]||'';
        const matcher=/\((\d+),(\d+)(?:,\d+)?\)/g;
        const tokens=[];
        let match;
        while((match=matcher.exec(body))){
          tokens.push({start:Number(match[1]),duration:Number(match[2]),textStart:matcher.lastIndex,markerStart:match.index});
        }
        tokens.forEach((token,index)=>{
          const text=body.slice(token.textStart,index+1<tokens.length?tokens[index+1].markerStart:body.length);
          if(text)words.push({start:token.start,duration:token.duration,text});
        });
        const text=words.map(word=>word.text).join('').trim();
        if(!text||credit.test(text))return;
        lines.push({t:Number(header[1]),duration:Number(header[2]),text,words});
      });
      return lines.sort((a,b)=>a.t-b.t);
    }

    function attachTranslations(lines,raw) {
      if(!lines.length||!raw)return lines;
      if(lines.every(line=>line.plain)){
        const translations=plainLyrics(raw);
        return lines.map((line,index)=>({...line,translation:translations[index]?.text||''}));
      }
      const translations=parseLrc(raw);
      if(!translations.length)return lines;
      let cursor=0;
      return lines.map(line=>{
        while(cursor+1<translations.length&&Math.abs(translations[cursor+1].t-line.t)<=Math.abs(translations[cursor].t-line.t))cursor++;
        const match=translations[cursor];
        return {...line,translation:match&&Math.abs(match.t-line.t)<=1200?match.text:''};
      });
    }

    function linePrimaryText(line) {
      return translationMode==='translated'&&line.translation ? line.translation : line.text;
    }

    // Native rendering consumes the parsed document; no DOM is built here.
    function renderLyrics(lines, message) {
      playback.lyrics=lines||[];
      playback.active=-1;
      updateNativeActiveLine(lyricPosition());
      emitNativeLyrics(message || (playback.lyrics.length ? '' : '未找到歌词'));
    }

    let contextBefore = 0;
    let contextAfter = 1;
    let compactContentState = '';

    function compactContextFor(lines, index, before, after) {
      if(index < 0 || index >= lines.length) return {before:[], after:[]};
      return {
        before:lines.slice(Math.max(0,index-before),index).map(linePrimaryText),
        after:lines.slice(index+1,index+1+after).map(linePrimaryText)
      };
    }

    function reportCompactContentState(hasLyrics, hasTranslation) {
      const state=hasLyrics+':'+hasTranslation;
      if(state===compactContentState)return;
      compactContentState=state;
      try {
        if(window.LobstaNativeLyrics && window.LobstaNativeLyrics.setCompactContentState)
          window.LobstaNativeLyrics.setCompactContentState(hasLyrics,hasTranslation);
      } catch(_) {}
    }

    let compactLineKey = '';
    let compactCleanupTimer = 0;
    let compactMarqueeFrame = 0;

    function setCompactTiming(viewport, delay, timeBudget) {
      viewport.dataset.requestedDelay = String(delay);
      if (Number.isFinite(timeBudget) && timeBudget > 0) {
        viewport.dataset.timeBudget = String(timeBudget);
      } else {
        delete viewport.dataset.timeBudget;
      }
    }

    function compactTextNode(className, text, delay, timeBudget, timedLine) {
      const viewport = document.createElement('span');
      viewport.className = className + ' compact-text-viewport';
      setCompactTiming(viewport, delay, timeBudget);
      const content = document.createElement('span');
      content.className = 'compact-scroll-text';
      if(translationMode!=='translated'&&timedLine&&Array.isArray(timedLine.words)&&timedLine.words.length){
        viewport.dataset.wordTimed='1';
        timedLine.words.forEach((word,index)=>{
          const span=document.createElement('span');
          span.className='compact-word';
          span.dataset.word=String(index);
          span.textContent=word.text;
          content.appendChild(span);
        });
      }else{
        content.textContent = text;
      }
      viewport.appendChild(content);
      return viewport;
    }

    function updateCompactMarquees() {
      if (compactMarqueeFrame) cancelAnimationFrame(compactMarqueeFrame);
      const viewports = ui.compactLyric.querySelectorAll('.compact-text-viewport');
      viewports.forEach(viewport => {
        viewport.classList.remove('marquee');
        viewport.style.removeProperty('--compact-shift');
        viewport.style.removeProperty('--compact-duration');
        viewport.style.removeProperty('--compact-delay');
      });
      compactMarqueeFrame = requestAnimationFrame(() => {
        compactMarqueeFrame = 0;
        if (!document.body.classList.contains('compact')) return;
        viewports.forEach(viewport => {
          if (!viewport.clientWidth || !viewport.offsetHeight) return;
          if (viewport.classList.contains('compact-next-line')&&viewport.dataset.translation!=='1') return;
          if (viewport.dataset.wordTimed==='1') return;
          const content = viewport.querySelector('.compact-scroll-text');
          const overflow = Math.ceil(content.scrollWidth - viewport.clientWidth);
          if (overflow <= 4) return;
          const requestedDelay = Math.max(0, Number(viewport.dataset.requestedDelay || 0));
          const timeBudget = Number(viewport.dataset.timeBudget || 0);
          const hasDeadline = Number.isFinite(timeBudget) && timeBudget > 0;
          const delay = hasDeadline
            ? Math.min(requestedDelay, timeBudget * .18)
            : requestedDelay;
          const naturalDuration = Math.min(5.2, Math.max(1.8, 1.45 + overflow / 90));
          const endPadding = hasDeadline ? Math.min(.18, timeBudget * .06) : 0;
          const availableDuration = hasDeadline
            ? Math.max(.08, timeBudget - delay - endPadding)
            : naturalDuration;
          const duration = Math.min(naturalDuration, availableDuration);
          viewport.style.setProperty('--compact-shift', -(overflow + 6) + 'px');
          viewport.style.setProperty('--compact-delay', delay + 's');
          viewport.style.setProperty('--compact-duration', duration + 's');
          viewport.classList.add('marquee');
        });
      });
    }

    function setCompactLyric(text, animate, followingText, currentTimeBudget, timedLine, secondaryIsTranslation, lineIndex = playback.active) {
      const value = String(text || '未找到歌词');
      const following = secondaryIsTranslation ? String(followingText || '').trim() : '';
      const context = compactContextFor(playback.lyrics, lineIndex, contextBefore, contextAfter);
      reportCompactContentState(playback.lyrics.length > 0, !!following);
      const timingKey=timedLine&&Array.isArray(timedLine.words)&&timedLine.words.length?String(timedLine.t):'';
      const key = value + '\u0000' + following + '\u0000' + timingKey +
        '\u0000' + (secondaryIsTranslation?'translation':'candidate') + JSON.stringify(context);
      if (key === compactLineKey && ui.compactLyric.children.length) {
        const current = ui.compactLyric.querySelector('.compact-line.current');
        const currentViewport = current && current.querySelector('.compact-line-text');
        if (currentViewport) setCompactTiming(currentViewport, .75, currentTimeBudget);
        const secondaryViewport=current&&current.querySelector('.compact-next-line[data-translation="1"]');
        if(secondaryViewport)setCompactTiming(secondaryViewport,.65,currentTimeBudget);
        updateCompactMarquees();
        return;
      }
      compactLineKey = key;
      clearTimeout(compactCleanupTimer);

      const previous = ui.compactLyric.querySelector('.compact-line.current');
      const next = document.createElement('div');
      next.className = 'compact-line' + (animate && previous ? '' : ' current no-transition');
      const appendContext = value => {
        const row=document.createElement('span');
        row.className='compact-context-line';
        row.textContent=value;
        next.appendChild(row);
      };
      context.before.forEach(appendContext);
      next.appendChild(compactTextNode('compact-line-text', value, .75, currentTimeBudget, timedLine));
      if (following) {
        const secondary=compactTextNode(
          'compact-next-line',
          following,
          secondaryIsTranslation ? .65 : 0,
          secondaryIsTranslation ? currentTimeBudget : 0
        );
        if(secondaryIsTranslation)secondary.dataset.translation='1';
        next.appendChild(secondary);
      }
      context.after.forEach(appendContext);

      if (!animate || !previous) {
        ui.compactLyric.replaceChildren(next);
        requestAnimationFrame(() => {
          next.classList.remove('no-transition');
          updateCompactMarquees();
        });
        return;
      }

      ui.compactLyric.querySelectorAll('.compact-line:not(.current)').forEach(node => node.remove());
      ui.compactLyric.appendChild(next);
      next.getBoundingClientRect();
      requestAnimationFrame(() => {
        previous.classList.remove('current');
        previous.classList.add('outgoing');
        next.classList.add('current');
        updateCompactMarquees();
      });
      compactCleanupTimer = setTimeout(() => {
        ui.compactLyric.querySelectorAll('.compact-line').forEach(node => {
          if (node !== next) node.remove();
        });
      }, 400);
    }

    function isPlainLyrics() {
      return !!(playback.lyrics.length&&playback.lyrics[0].plain);
    }

    function plainPlaybackProgress() {
      if(!isPlainLyrics()||playback.durationMs<=0)return 0;
      return Math.max(0,Math.min(1,(currentPosition()/playback.durationMs-.025)/.95));
    }

    function plainPlaybackIndex() {
      if(!isPlainLyrics())return Math.max(0,playback.active);
      return Math.max(0,Math.min(playback.lyrics.length-1,
        Math.floor(plainPlaybackProgress()*playback.lyrics.length)));
    }

    function updateActiveLine(position) {
      updateNativeActiveLine(position);
    }

    function lyricCacheEpoch() {
      try { return Number(window.LobstaNativeLyrics?.lyricCacheEpoch?.()) || 0; }
      catch (_) { return 0; }
    }

    function pruneLyricsCache() {
      try {
        const entries = [];
        const epoch = lyricCacheEpoch();
        for (let index = 0; index < localStorage.length; index++) {
          const key = localStorage.key(index);
          if (!key?.startsWith('lobsta-lyrics:')) continue;
          const raw = localStorage.getItem(key);
          let data = null;
          try { data = JSON.parse(raw); } catch (_) {}
          entries.push({ key, bytes: (raw || '').length * 2, savedAt: Number(data?.savedAt) || 0,
            usable: data?.schema === LYRICS_CACHE_SCHEMA && (Number(data?.epoch) || 0) === epoch });
        }
        entries.sort((left, right) => right.savedAt - left.savedAt);
        let bytes = 0, count = 0;
        for (const entry of entries) {
          if (!entry.usable || entry.savedAt <= 0 || Date.now() - entry.savedAt > 14 * 86400000 ||
              count >= 60 || bytes + entry.bytes > 4 * 1024 * 1024) {
            localStorage.removeItem(entry.key);
          } else { bytes += entry.bytes; count++; }
        }
      } catch (_) {}
    }

    function cachedLyrics(key) {
      try {
        const raw = localStorage.getItem('lobsta-lyrics:' + hash(key));
        if (!raw) return null;
        const value = JSON.parse(raw);
        if (value.schema !== LYRICS_CACHE_SCHEMA) return null;
        if ((Number(value.epoch) || 0) !== lyricCacheEpoch()) {
          localStorage.removeItem('lobsta-lyrics:' + hash(key));
          return null;
        }
        if (!Number.isFinite(value.savedAt) || value.savedAt <= 0 || Date.now() - value.savedAt > 14 * 86400000) return null;
        if (!isUsableLyricPayload(value.lyrics) || value.source === '自定义歌词') return null;
        const duration = Number(value.duration || 0);
        if (duration > 0 && playback.durationMs > 0 && Math.abs(duration - playback.durationMs) > Math.max(3000, playback.durationMs / 30)) return null;
        return value;
      } catch (_) { return null; }
    }

    function saveLyrics(key, value) {
      try {
        localStorage.setItem('lobsta-lyrics:' + hash(key), JSON.stringify({
          schema:LYRICS_CACHE_SCHEMA,
          epoch:lyricCacheEpoch(),
          lyrics:isUsableLyricPayload(value.lyrics)?value.lyrics:'',
          translatedLyrics:isUsableLyricPayload(value.translatedLyrics)?value.translatedLyrics:'',
          wordLyrics:isUsableLyricPayload(value.wordLyrics)?value.wordLyrics:'',
          duration:Number(value.duration || 0), cover:value.cover || '', source:value.source || '',
          alternatives:Array.isArray(value.alternatives)?value.alternatives.slice(0,3):[],
          lossless:!!value.lossless, hiResLossless:!!value.hiResLossless,
          dolbyAtmos:!!value.dolbyAtmos, savedAt:Date.now()
        }));
        pruneLyricsCache();
      } catch (_) {}
    }

    function hash(input) {
      let h = 2166136261;
      for (let i=0; i<input.length; i++) { h ^= input.charCodeAt(i); h = Math.imul(h,16777619); }
      return (h >>> 0).toString(36);
    }

    function isUsableLyricPayload(value) {
      if(typeof value!=='string')return false;
      const normalized=value.trim().toLowerCase();
      return !!normalized&&normalized!=='null'&&normalized!=='undefined';
    }

    function lyricsCandidateSignature(candidates) {
      return candidates.map(candidate=>[
        candidate.source||'',candidate.lyrics||'',candidate.translatedLyrics||'',candidate.wordLyrics||''
      ].join('\u0000')).join('\u0001');
    }

    async function fetchFallback(track, artist, signal) {
      const url = 'https://lrclib.net/api/search?track_name=' + encodeURIComponent(track) + '&artist_name=' + encodeURIComponent(artist);
      const response = await fetch(url, { signal, headers:{'Accept':'application/json'} });
      if (!response.ok) throw new Error('LRCLIB ' + response.status);
      const list = await response.json();
      if (!Array.isArray(list) || !list.length) return {};
      const match = list.find(item => isUsableLyricPayload(item.syncedLyrics)) ||
        list.find(item => isUsableLyricPayload(item.plainLyrics));
      if(!match)return {};
      return {
        lyrics:isUsableLyricPayload(match.syncedLyrics)?match.syncedLyrics:match.plainLyrics,
        duration:Number(match.duration || 0) * 1000,
        source:'LRCLIB'
      };
    }

    // 先同步问原生：这首歌有没有用户手动指定的自定义 LRC 歌词。有就直接用，不再联网。
    function customLyricsFor(track, artist) {
      try {
        if (window.LobstaNativeLyrics && window.LobstaNativeLyrics.customLyrics) {
          const raw = window.LobstaNativeLyrics.customLyrics(track||'', artist||'', playback.durationMs||0);
          if (raw) { const data = JSON.parse(raw); if (data && isUsableLyricPayload(data.lyrics)) return data; }
        }
      } catch (_) {}
      return null;
    }

    async function resolveTrack(track, artist, key, requestId) {
      // 自定义歌词优先，命中即上屏并 return，不打网络也不写自动匹配记忆
      const custom = customLyricsFor(track, artist);
      if (custom) {
        applyResolved(custom, key, requestId);
        return;
      }
      let shared = null;
      try {
        const raw = window.LobstaNativeLyrics?.cachedLyrics?.(track, artist, playback.album||'', playback.durationMs||0);
        if (raw) {
          const data = JSON.parse(raw);
          if (isUsableLyricPayload(data.lyrics)) shared = data;
        }
      } catch (_) {}
      const cached = shared || cachedLyrics(key);
      if (cached) {
        playback.abort?.abort();
        applyResolved(cached, key, requestId);
        return;
      }
      playback.abort?.abort();
      const controller = new AbortController();
      playback.abort = controller;

      if (window.LobstaNativeLyrics && window.LobstaNativeLyrics.requestLyrics) {
        try {
          window.LobstaNativeLyrics.requestLyrics(
            track,
            artist,
            playback.album||'',
            playback.durationMs||0,
            requestId,
            !nativeRendering && !playback.coverIsNative
          );
          return;
        } catch (_) {}
      }

      try {
        const data = await fetchFallback(track,artist,controller.signal);
        if (key !== playback.key || requestId !== playback.requestId) return;
        if (isUsableLyricPayload(data.lyrics)) {
          saveLyrics(key,data);
          applyResolved(data,key,requestId);
        } else if (!cached) renderLyrics([], '未找到歌词', true);
      } catch (error) {
        if (error && error.name === 'AbortError') return;
        if (!cached && key === playback.key) renderLyrics([], '未找到歌词', true);
      }
    }

    function receiveLyrics(requestId, data) {
      if (requestId !== playback.requestId || !playback.key) return;
      if (data && isUsableLyricPayload(data.lyrics)) {
        // A transient rich-lyrics failure must not erase verified words for the same recording.
        const prior=cachedLyrics(playback.key);
        if(Array.isArray(data.alternatives)&&prior){
          const previous=prior.alternatives||[];
          data.alternatives=data.alternatives.map(c=>{
            const old=previous.find(x=>x.source===c.source&&x.recordId&&x.recordId===c.recordId);
            return old&&completeWordLyrics(old,parseLrc(old.lyrics)).length&&!completeWordLyrics(c,parseLrc(c.lyrics)).length?old:c;
          });
        }
        saveLyrics(playback.key, data);
        applyResolved(data, playback.key, requestId);
      } else if (!cachedLyrics(playback.key)) {
        renderLyrics([], '未找到歌词', true);
      }
    }

    function receiveRemoteCover(requestId, cover) {
      if (requestId !== playback.requestId || !cover || playback.coverIsNative) return;
      setCover(cover, false);
      const cached = cachedLyrics(playback.key);
      if (cached) {
        cached.cover = cover;
        saveLyrics(playback.key, cached);
      }
    }

    function completeWordLyrics(data,lines) {
      const words=parseWordLyrics(data.wordLyrics);
      const base=lines.length?lines:plainLyrics(data.lyrics);
      const length=rows=>rows.reduce((total,line)=>total+String(line.text||'').replace(/\s/g,'').length,0);
      // Retain the full line/plain track when the word track only contains a title or fragment.
      if(base.length && (words.length<base.length*.7 || length(words)<length(base)*.7))return [];
      return words;
    }

    function candidateQuality(data) {
      const lines=parseLrc(data.lyrics);
      const words=completeWordLyrics(data,lines);
      const base=lines.length?lines:plainLyrics(data.lyrics);
      const count=Math.max(1,base.length);
      const wordCoverage=Math.min(1,words.length/count);
      const translated=attachTranslations(lines.length?lines:words,data.translatedLyrics);
      const translationCoverage=Math.min(1,translated.filter(line=>line.translation).length/count);
      const score=Number(data.matchScore)||0;
      return (score>=95?200000:100000)+score*100+
        (translationMode==='original'?wordCoverage*30000:translationCoverage*20000+wordCoverage*10000);
    }

    function preferredCandidateIndex() {
      let best=0;
      playback.candidates.forEach((candidate,index)=>{
        if(candidateQuality(candidate)>candidateQuality(playback.candidates[best]))best=index;
      });
      return best;
    }

    let manualSourceKey='';
    let automaticCandidates=[];
    function applyResolved(data, key, requestId) {
      if (key !== playback.key || requestId !== playback.requestId) return;
      const supplied=Array.isArray(data.alternatives)&&data.alternatives.length?data.alternatives:[data];
      automaticCandidates=supplied.filter(candidate=>candidate&&isUsableLyricPayload(candidate.lyrics));
      const candidates=supplied.filter(candidate=>candidate&&isUsableLyricPayload(candidate.lyrics)).map(candidate=>{
        if(candidate.custom)return candidate; // 自定义歌词不参与自动匹配记忆合并
        const remembered=readMatchMemories().find(entry=>entry.key===matchMemoryKey(candidate.source));
        if(!isManualMemory(remembered))return candidate;
        const old=remembered.candidate;
        if(old.recordId&&old.recordId===candidate.recordId&&
            completeWordLyrics(candidate,parseLrc(candidate.lyrics)).length>
            completeWordLyrics(old,parseLrc(old.lyrics)).length)return candidate;
        return old;
      });
      const signature=lyricsCandidateSignature(candidates);
      if(signature&&signature===candidateSignature&&playback.candidates.length)return;
      candidateSignature=signature;
      const selectedSource=manualSourceKey===key?playback.candidates[playback.candidateIndex]?.source:null;
      playback.candidates=candidates;
      playback.candidateIndex=0;
      const remembered=candidates.findIndex(candidate=>candidate.source===selectedSource);
      applyCandidate(remembered>=0?remembered:preferredCandidateIndex());
    }

    function applyCandidate(index) {
      if(!playback.candidates.length){renderLyrics([],'未找到歌词');return;}
      const normalized=((Number(index)||0)%playback.candidates.length+playback.candidates.length)%playback.candidates.length;
      playback.candidateIndex=normalized;
      const data=playback.candidates[normalized];
      if(window.LobstaNativeLyrics&&window.LobstaNativeLyrics.lyricSourceOffset){
        try{
          const remembered=Number(window.LobstaNativeLyrics.lyricSourceOffset(
            playback.key,data.source||'歌词源',playback.track||'',playback.artist||''));
          if(Number.isFinite(remembered))playback.lyricOffsetMs=Math.max(-5000,Math.min(5000,remembered));
        }catch(_){}
      }
      const lineTimed=parseLrc(data.lyrics);
      const wordTimed=data.custom?parseWordLyrics(data.wordLyrics):completeWordLyrics(data,lineTimed);
      let base=wordTimed.length?wordTimed:(lineTimed.length?lineTimed:plainLyrics(data.lyrics));
      if(data.custom&&lineTimed.length){
        // Keep every corrected line; unchanged rows alone carry the saved karaoke timing.
        const wordsByTime=new Map(wordTimed.map(line=>[Math.round(line.t),line]));
        base=lineTimed.map(line=>{
          const word=wordsByTime.get(Math.round(line.t));
          return word&&word.text===line.text?{...line,duration:word.duration,words:word.words}:line;
        });
      }
      if((!playback.durationMs||playback.durationMs<1000)&&Number(data.duration)>0)playback.durationMs=Number(data.duration);
      renderLyrics(attachTranslations(base,data.translatedLyrics),data.lyrics?'':'未找到歌词');
      if(data.cover)setCover(data.cover,false);
      requestSupplement();
    }

    let sourceClickTimer=0,sourceHoldTimer=0,sourceHoldUsed=false,rematchOperation=0,rematchPending=null;
    const rejectedMatches=new Map();
    function matchMemoryKey(source){return playback.key+'|'+Math.round(playback.durationMs/1000)+'|'+source;}
    // 手动选定的记忆：存在、非待复核(needsReview)、且非主页自动写入(auto)。只有它才覆盖自动候选。
    function isManualMemory(entry){return !!entry&&!entry.needsReview&&!entry.auto;}
    function readMatchMemories(){
      try{
        const native=window.LobstaNativeLyrics?.readMatchMemory?.();
        const raw=native||localStorage.getItem('lyric-match-memory')||'[]';
        const entries=JSON.parse(raw).filter(x=>x.candidate&&isUsableLyricPayload(x.candidate.lyrics)).map(x=>{
          if(!x.title){const parts=x.key.split('|'),identity=parts.slice(0,-2).join('|').split('\u0000');
            return {...x,title:identity[0],artist:identity[1]||'',source:x.candidate.source,duration:Number(parts.at(-2))*1000,needsReview:true};}
          return x;
        });
        if(!native&&entries.length)writeMatchMemories(entries);
        return entries;
      }catch(_){return [];}
    }
    function writeMatchMemories(entries){
      const value=JSON.stringify(entries);
      if(window.LobstaNativeLyrics?.writeMatchMemory)window.LobstaNativeLyrics.writeMatchMemory(value);
      else localStorage.setItem('lyric-match-memory',value);
    }
    function rememberMatch(source,candidate){
      const key=matchMemoryKey(source),all=readMatchMemories(),old=all.find(x=>x.key===key);
      let entries=all.filter(x=>x.key!==key);
      if(candidate){
        const original=old?.original||automaticCandidates.find(x=>x.source===source)||playback.candidates.find(x=>x.source===source);
        const clean=x=>({...x,alternatives:[]});
        const history=[original,...(old?.history||[]),candidate].filter(Boolean).map(clean)
          .filter((x,i,a)=>a.findIndex(y=>(y.recordId||y.lyrics)===(x.recordId||x.lyrics))===i);
        entries.push({key,at:Date.now(),title:playback.track,artist:playback.artist,album:playback.album||'',duration:playback.durationMs,source,
          candidate:clean(candidate),original:original?clean(original):null,history});
      }
      try{writeMatchMemories(entries);}catch(_){}
    }
    function refreshMatchManagement(){
      if(rematchPending){clearTimeout(rematchPending.timer);rematchPending=null;}
      rejectedMatches.clear();
      const entries=readMatchMemories();
      // 只有手动选定(isManualMemory)的记忆才覆盖候选；自定义歌词候选保持不动
      playback.candidates=playback.candidates.map(c=>{
        if(c.custom)return c;
        const remembered=entries.find(x=>x.key===matchMemoryKey(c.source));
        return (isManualMemory(remembered)?remembered.candidate:null)||automaticCandidates.find(x=>x.source===c.source)||c;
      });
      if(playback.candidates.length)applyCandidate(playback.candidateIndex);
    }
    // Hidden engine: feedback is rendered natively, so notices are intentionally silent.
    function matchNotice(){}
    function rematchCurrentSource(reset=false){
      if(rematchPending)return;
      const candidate=playback.candidates[playback.candidateIndex];
      if(!candidate)return;
      if(candidate.custom)return;
      if(!window.LobstaNativeLyrics?.rematchLyrics)return;
      const key=matchMemoryKey(candidate.source);
      if(reset){
        const original=readMatchMemories().find(x=>x.key===key)?.original||automaticCandidates.find(x=>x.source===candidate.source);
        rememberMatch(candidate.source,null);rejectedMatches.delete(key);
        if(original){playback.candidates[playback.candidateIndex]=original;applyCandidate(playback.candidateIndex);return;}
      }else rememberMatch(candidate.source,candidate);
      const excluded=reset?[]:(rejectedMatches.get(key)||[]);
      if(!reset&&candidate.recordId&&!excluded.includes(candidate.recordId))excluded.push(candidate.recordId);
      rejectedMatches.set(key,excluded);
      if(rejectedMatches.size>32)rejectedMatches.delete(rejectedMatches.keys().next().value);
      const operation=++rematchOperation;
      rematchPending={operation,key:playback.key,source:candidate.source,reset};
      rematchPending.timer=setTimeout(()=>{if(rematchPending?.operation===operation)rematchPending=null;},30000);
      window.LobstaNativeLyrics.rematchLyrics(playback.track,playback.artist,playback.album||'',playback.durationMs,candidate.source,JSON.stringify(excluded),playback.requestId,operation);
    }
    function receiveRematch(requestId,operation,data){
      const pending=rematchPending;
      if(!pending||pending.operation!==operation)return;
      clearTimeout(pending.timer);rematchPending=null;
      if(requestId!==playback.requestId||pending.key!==playback.key)return;
      if(data.error||!isUsableLyricPayload(data.lyrics))return;
      const index=playback.candidates.findIndex(x=>x.source===pending.source);
      if(index<0)return;
      playback.candidates[index]=data;
      if(!pending.reset)rememberMatch(pending.source,data);
      manualSourceKey=playback.key;applyCandidate(index);
    }
    function setCover(source, isNative) {
      if (!source) return;
      playback.cover = source;
      playback.coverIsNative = !!isNative;
    }

    function clearEngineSession(message) {
      if(playback.hasSession || playback.key){
        playback.requestId++;
        playback.abort?.abort();
        ++supplementEpoch;
        if(window.LobstaNativeLyrics&&window.LobstaNativeLyrics.cancelSupplement)window.LobstaNativeLyrics.cancelSupplement();
      }
      clearTimeout(supplementRequestTimer);
      supplementRequestTimer=0;
      supplementDueAt=0;
      supplementInFlight=false;
      supplementWindowEnd=-1;
      supplementRequestedIds=[];
      supplementSkippedIds.clear();
      if(rematchPending){clearTimeout(rematchPending.timer);rematchPending=null;}
      playback.hasSession=false;
      playback.key='';playback.track='';playback.artist='';
      playback.state='stopped';playback.positionMs=0;playback.durationMs=0;playback.speed=0;
      playback.candidates=[];playback.lyrics=[];playback.active=-1;
      automaticCandidates=[];candidateSignature='';manualSourceKey='';
      emitNativeLyrics(message);
    }

    function updatePlayback(data) {
      if (!data || data.permissionRequired) {
        clearEngineSession('请授予通知使用权');
        return;
      }
      if (!data.hasSession || !data.track) {
        clearEngineSession('未在播放');
        return;
      }

      const key = normalizedKey(data.track || '', data.artist || '');
      const changed = key !== playback.key;
      // 在覆盖 playback 之前，算出"此刻本地外推到的位置"，用于平滑对齐。
      // MediaSession 报告的位置常有抖动/滞后，直接硬覆盖会让逐字进度一卡一卡。
      const wasPlaying = playback.state === 'playing';
      const extrapolatedBefore = currentPosition();
      playback.hasSession = true;
      playback.track = data.track || '';
      playback.artist = data.artist || '';
      playback.album = data.album || '';
      playback.state = data.state || 'paused';
      const reportedPositionMs = Number(data.positionMs || 0);
      playback.durationMs = Number(data.durationMs || 0) || (changed ? 0 : playback.durationMs);
      playback.speed = playback.state === 'playing' ? Number(data.speed || 1) : 0;
      playback.canPlay = !!data.canPlay;
      playback.canPause = !!data.canPause;
      playback.canPrevious = !!data.canPrevious;
      playback.canNext = !!data.canNext;
      playback.canSeek = !!data.canSeek;
      // 平滑对齐：同一首歌、持续播放中，报告位置与外推位置只是小幅漂移(≤700ms)时，
      // 保持本地外推的连续性(不打断逐字)；只有大跳(真实 seek / 换歌 / 从暂停恢复)才硬对齐。
      if (!changed && wasPlaying && playback.state === 'playing' &&
          Math.abs(reportedPositionMs - extrapolatedBefore) <= 700) {
        playback.positionMs = extrapolatedBefore;
      } else {
        playback.positionMs = reportedPositionMs;
      }
      playback.receivedAt = performance.now();

      if (changed) {
        supplementEpoch++;
        if(window.LobstaNativeLyrics&&window.LobstaNativeLyrics.cancelSupplement)window.LobstaNativeLyrics.cancelSupplement();
        playback.key = key;
        automaticCandidates=[];
        playback.requestId++;
        playback.candidates = [];
        playback.candidateIndex = 0;
        candidateSignature = '';
        playback.cover = '';
        playback.coverIsNative = false;
        renderLyrics([], '正在匹配歌词…');
        if (data.cover) setCover(data.cover, true);
        resolveTrack(playback.track, playback.artist, key, playback.requestId);
      } else if (data.cover && (!playback.cover || !playback.coverIsNative)) {
        setCover(data.cover, true);
      }
      engineTick();
    }

    function setFontScale(percent) {
      lyricFontScale=Math.max(35,Math.min(150,Number(percent)||100))/100;
    }

    pruneLyricsCache();
    window.LobstaOverlay = {
      engineTick,
      refreshMatchManagement,
      receiveRematch,
      // 自定义歌词被新增/编辑/删除后，重新解析当前这首歌（走 resolveTrack，会先查自定义）
      reloadCustomLyrics() {
        if(!playback.key)return;
        candidateSignature='';
        playback.requestId++;
        resolveTrack(playback.track, playback.artist, playback.key, playback.requestId);
      },
      receiveSupplement,
      refreshSupplement() {
        if(playback.candidates.length)applyCandidate(playback.candidateIndex);
      },
      updatePlayback,
      receiveLyrics,
      receiveRemoteCover,
      setFontScale,
      setLyricColor(value) {
        const match=String(value||'').trim().match(/^#([0-9a-f]{6})$/i);
        if(!match)return;
        const hex=match[1];
        const rgb=[0,2,4].map(index=>parseInt(hex.slice(index,index+2),16));
        document.documentElement.style.setProperty('--lyric-rgb',rgb.join(','));
      },
      setLyricOffset(value) {
        playback.lyricOffsetMs=Math.max(-5000,Math.min(5000,Number(value)||0));
        updateActiveLine(lyricPosition());
      },
      setTranslationMode(value) {
        translationMode=['original','bilingual','translated'].includes(value)?value:'bilingual';
        if(playback.candidates.length)applyCandidate(preferredCandidateIndex());
      },
      setContext(before, after) {
        contextBefore=Math.max(0,Math.min(2,Math.round(Number(before)||0)));
        contextAfter=Math.max(0,Math.min(2,Math.round(Number(after)||0)));
        compactLineKey='';
        updateActiveLine(lyricPosition(),true);
      },
      setHorizontalLayout() {
        document.body.classList.remove('horizontal-layout');
      },
      setCompact() {
        document.body.classList.add('compact');
      },
      setBackgroundMode(value) {
        // 只保留三档：透明 / 半透明(low) / 不透明(high)。medium 归并到半透明。动态特效已移除。
        backgroundMode = value === 'high' ? 'high' : (value === 'medium' || value === 'low') ? 'low' : 'transparent';
        document.body.classList.toggle('background-transparent', backgroundMode === 'transparent');
        document.body.classList.toggle('background-low', backgroundMode === 'low');
        document.body.classList.remove('background-medium','background-high');
        if(backgroundMode==='high')document.body.classList.add('background-high');
      }
    };

  })();
  </script>
</body>
</html>
