name: Website checks

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assets/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Build and validate static site
        run: npm run build && npm run check
      - name: Install browser and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser checks and preview screenshots
        run: npm test
      - name: Upload static website (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-website-static
          path: website/dist/
          include-hidden-files: true
      - name: Upload previews and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-website-preview
          path: |
            website/screenshots/
            website/playwright-report/
            website/test-results/
          retention-days: 14
