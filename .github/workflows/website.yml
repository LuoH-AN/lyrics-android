name: Website checks and deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assets/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/assets/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Build and validate static site
        run: npm run build && npm run check
      - name: Install browser and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser checks and preview screenshots
        run: npm test
      - name: Upload static website
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lyrics-website-static
          path: website/dist/
          include-hidden-files: true
      - name: Upload previews and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lyrics-website-preview
          path: |
            website/screenshots/
            website/playwright-report/
            website/test-results/
          retention-days: 14
      - name: Prepare Pages artifact after successful tests
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist/
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check public website
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          assert base == 'https://luoh-an.github.io/lyrics-android/', base
          targets = {
              '': ('text/html', '歌照常听。'),
              'styles.css': ('text/css', 'font-size: 18px'),
              'app.js': ('javascript', 'renderPosition'),
              'assets/app-icon.svg': ('image/svg+xml', '<svg'),
              'sitemap.xml': ('xml', base),
          }
          for attempt in range(12):
              try:
                  for target, (content_type, marker) in targets.items():
                      request = urllib.request.Request(base + target, headers={'User-Agent': 'lyrics-website-deploy-check', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          assert response.status == 200, (target, response.status)
                          assert content_type in response.headers.get('Content-Type', ''), target
                          assert marker in response.read().decode(), target
                  print('Verified public website:', base)
                  break
              except Exception as error:
                  if attempt == 11:
                      raise
                  print('Waiting for Pages publication:', type(error).__name__, str(error))
                  time.sleep(10)
          PY
