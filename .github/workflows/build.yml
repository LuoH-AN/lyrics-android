name: Build Nightly APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_checks:
        description: "Run Node and Android checks (slower)"
        type: boolean
        default: false
      full_optimization:
        description: "Use full R8 optimization for the Nightly APK (slower)"
        type: boolean
        default: false
      android_tests:
        description: "Optional Android test class filters, separated by commas"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Each pushed commit keeps its build, even when another commit arrives.
  group: nightly-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.nightly.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Read Nightly version
        id: nightly
        run: echo "version=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Feature-branch pushes must also populate caches for the next build.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # Avoid starting a second Gradle build just to prune a short-lived CI cache.
          cache-cleanup: never

      - name: Run regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: node tests/run.cjs

      - name: Build Nightly APK
        env:
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleNightly -PnightlyVersion="$NIGHTLY_VERSION" -PfullOptimization=${{ github.event_name == 'workflow_dispatch' && inputs.full_optimization || false }} --stacktrace

      - name: Run optional Android checks
        if: github.event_name == 'workflow_dispatch' && (inputs.full_checks || inputs.android_tests != '')
        env:
          ANDROID_TEST_FILTERS: ${{ inputs.android_tests }}
          ROBOLECTRIC_REPOSITORY_URL: https://maven-central.storage-download.googleapis.com/maven2
        run: |
          args=(testDebugUnitTest --stacktrace)
          if [[ -n "$ANDROID_TEST_FILTERS" ]]; then
            IFS=',' read -ra filters <<< "$ANDROID_TEST_FILTERS"
            for filter in "${filters[@]}"; do
              args+=(--tests "$filter")
            done
          fi
          ./gradlew "${args[@]}"

      - name: Verify Nightly APK and size
        env:
          NIGHTLY_VERSION: ${{ steps.nightly.outputs.version }}
        run: |
          python3 tools/check-apk-size.py app/build/outputs/apk/nightly/app-nightly.apk --report app/build/reports/package-size/size.json
          python3 tools/verify-nightly-apk.py

      - name: Upload optional Android test reports
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.full_checks || inputs.android_tests != '')
        uses: actions/upload-artifact@v4
        with:
          name: material-ui-checks
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload Nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-android-nightly-${{ steps.nightly.outputs.version }}
          path: app/build/outputs/apk/nightly/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Preserve Nightly crash mapping
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-android-nightly-mapping-${{ steps.nightly.outputs.version }}
          path: app/build/outputs/mapping/nightly/mapping.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - name: Download verified Nightly APK
        uses: actions/download-artifact@v4
        with:
          name: lyrics-android-nightly-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIGHTLY_VERSION: ${{ needs.build.outputs.version }}
        run: |
          head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is available on $GITHUB_REF_NAME."
            exit 0
          fi

          apk_name="lyrics-android-nightly-${NIGHTLY_VERSION}-arm64-v8a.apk"
          mv dist/app-nightly.apk "dist/$apk_name"
          title="桌面歌词 Nightly ${NIGHTLY_VERSION}"
          printf '默认分支的 Nightly 构建。\n\n- 源码提交：[%s](%s/%s/commit/%s)\n- 下载：[%s](%s/%s/releases/download/nightly/%s)\n- 签名与 Debug 版相同。\n' \
            "$NIGHTLY_VERSION" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_SHA" \
            "$apk_name" "$GITHUB_SERVER_URL" "$GH_REPO" "$apk_name" > dist/notes.md

          if assets=$(gh release view nightly --json assets --jq '.assets[] | select(.state == "uploaded") | .name'); then
            if ! grep -Fxq "$apk_name" <<< "$assets"; then
              gh release upload nightly "dist/$apk_name" --clobber
            fi
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true --silent
            gh release edit nightly --prerelease --latest=false --draft=false --title "$title" --notes-file dist/notes.md
            while IFS= read -r asset; do
              if [[ "$asset" == lyrics-android-nightly-*-arm64-v8a.apk && "$asset" != "$apk_name" ]]; then
                gh release delete-asset nightly "$asset" --yes
              fi
            done <<< "$assets"
          else
            gh release create nightly "dist/$apk_name" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "$title" --notes-file dist/notes.md
          fi

          printf '[下载 Nightly APK](%s/%s/releases/tag/nightly)\n' "$GITHUB_SERVER_URL" "$GH_REPO" >> "$GITHUB_STEP_SUMMARY"
