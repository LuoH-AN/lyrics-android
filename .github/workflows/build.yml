name: Build Compact Test APK

on:
  push:
    branches: [main, "dev/**", "feat/**"]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/website*.yml"
      - ".github/workflows/showcase-video.yml"
      - "tools/showcase-video/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/website*.yml"
      - ".github/workflows/showcase-video.yml"
      - "tools/showcase-video/**"
  workflow_dispatch:
    inputs:
      full_checks:
        description: "Run Node and Android checks (slower)"
        type: boolean
        default: false
      full_optimization:
        description: "Use full R8 optimization for the test APK (slower)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Feature-branch pushes must also populate caches for the next build.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # Avoid starting a second Gradle build just to prune a short-lived CI cache.
          cache-cleanup: never

      - name: Run regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: node tests/run.cjs

      - name: Build compact APK
        run: |
          chmod +x gradlew
          ./gradlew assembleCompact -PfullOptimization=${{ github.event_name == 'workflow_dispatch' && inputs.full_optimization || false }} --stacktrace

      - name: Run optional Android checks
        if: github.event_name == 'workflow_dispatch' && inputs.full_checks
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify compact APK and size
        run: |
          python3 tools/check-apk-size.py app/build/outputs/apk/compact/app-compact.apk --report app/build/reports/package-size/size.json
          python3 tools/verify-compact-apk.py

      - name: Upload optional Android test reports
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_checks
        uses: actions/upload-artifact@v4
        with:
          name: material-ui-checks
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload compact test APK
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-android-debug
          path: app/build/outputs/apk/compact/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Preserve compact crash mapping
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-android-compact-mapping
          path: app/build/outputs/mapping/compact/mapping.txt
          if-no-files-found: error
          retention-days: 90
