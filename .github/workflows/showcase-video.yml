name: Render introduction video

on:
  push:
    branches: [main]
    paths:
      - "website/showcase/scene.mjs"
      - "website/showcase/audio.mjs"
      - "website/fonts/lyrics-motion.ttf"
      - "tools/showcase-video/**"
      - ".github/workflows/showcase-video.yml"
  workflow_dispatch:
    inputs:
      fps:
        description: "Video frame rate"
        type: choice
        options: ["120", "60", "30"]
        default: "120"
      resolution:
        description: "Video resolution"
        type: choice
        options: ["1080p", "720p"]
        default: "1080p"
      layout:
        description: "Lyric layout (auto demonstrates all three)"
        type: choice
        options: ["auto", "staggered", "centered", "stairs"]
        default: "auto"

permissions:
  contents: read

concurrency:
  group: showcase-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/showcase-video/package-lock.json
      - name: Install native canvas renderer
        working-directory: tools/showcase-video
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare video encoder
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Render MP4 from the shared animation
        env:
          VIDEO_FPS: ${{ inputs.fps || '120' }}
          VIDEO_RESOLUTION: ${{ inputs.resolution || '1080p' }}
          VIDEO_LAYOUT: ${{ inputs.layout || 'auto' }}
        run: node tools/showcase-video/render.mjs
      - name: Upload introduction video
        id: video
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-introduction-${{ inputs.resolution || '1080p' }}-${{ inputs.fps || '120' }}fps
          path: dist/showcase-video/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Add download link
        env:
          ARTIFACT_URL: ${{ steps.video.outputs.artifact-url }}
        run: printf '\n[下载 MP4 成片](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
